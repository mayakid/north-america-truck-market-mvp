<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Held-out model comparison for DrayEasy Market Radar</title>
  <desc id="desc">LambdaRank beats the historical-volume baseline on the primary NDCG at 5 gate, while the baseline remains stronger on Precision at 5, MAP at 5 and Spearman.</desc>
  <rect width="1600" height="900" fill="#f4f1e9"/>
  <rect x="56" y="52" width="1488" height="796" rx="30" fill="#fffefa" stroke="#d6dbd4"/>
  <circle cx="108" cy="108" r="26" fill="#14251f"/>
  <text x="108" y="117" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#f4f1e9">D</text>
  <circle cx="126" cy="91" r="6" fill="#ff6b3d"/>
  <text x="154" y="103" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#14251f">DRAYEASY MARKET RADAR</text>
  <text x="154" y="127" font-family="Arial, sans-serif" font-size="11" letter-spacing="2" fill="#62716a">HELD-OUT MODEL VALIDATION · 41,326 QUERY GROUPS</text>
  <text x="98" y="192" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#14251f">The primary ranking gate passed.</text>
  <text x="98" y="226" font-family="Arial, sans-serif" font-size="17" fill="#62716a">LambdaRank improves NDCG@5 by 0.0091, but does not lead every metric.</text>

  <rect x="1112" y="164" width="346" height="78" rx="18" fill="#14251f"/>
  <text x="1138" y="194" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9eaea6">PRIMARY GATE · NDCG@5</text>
  <text x="1138" y="224" font-family="Arial, sans-serif" font-size="27" font-weight="800" fill="#fffefa">0.9276 <tspan font-size="15" fill="#ff9a78">vs 0.9185</tspan></text>

  <g font-family="Arial, sans-serif" font-size="13" fill="#62716a">
    <rect x="99" y="272" width="12" height="12" rx="3" fill="#ff6b3d"/><text x="120" y="283">LambdaRank</text>
    <rect x="234" y="272" width="12" height="12" rx="3" fill="#0e7c72"/><text x="255" y="283">Historical-volume baseline</text>
    <rect x="458" y="272" width="12" height="12" rx="3" fill="#3366cc"/><text x="479" y="283">Recent-growth baseline</text>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="98" y="341" font-size="14" font-weight="700" fill="#14251f">NDCG@5</text>
    <rect x="270" y="318" width="667.9" height="18" rx="9" fill="#ff6b3d"/><text x="950" y="333" font-size="13" font-weight="700" fill="#14251f">0.9276</text>
    <rect x="270" y="343" width="661.3" height="18" rx="9" fill="#0e7c72"/><text x="944" y="358" font-size="13" fill="#14251f">0.9185</text>
    <rect x="270" y="368" width="578.0" height="18" rx="9" fill="#3366cc"/><text x="861" y="383" font-size="13" fill="#14251f">0.8028</text>

    <text x="98" y="451" font-size="14" font-weight="700" fill="#14251f">Precision@5</text>
    <rect x="270" y="428" width="531.5" height="18" rx="9" fill="#ff6b3d"/><text x="814" y="443" font-size="13" fill="#14251f">0.7382</text>
    <rect x="270" y="453" width="563.4" height="18" rx="9" fill="#0e7c72"/><text x="846" y="468" font-size="13" font-weight="700" fill="#14251f">0.7825</text>
    <rect x="270" y="478" width="463.8" height="18" rx="9" fill="#3366cc"/><text x="747" y="493" font-size="13" fill="#14251f">0.6442</text>

    <text x="98" y="561" font-size="14" font-weight="700" fill="#14251f">MAP@5</text>
    <rect x="270" y="538" width="484.1" height="18" rx="9" fill="#ff6b3d"/><text x="767" y="553" font-size="13" fill="#14251f">0.6723</text>
    <rect x="270" y="563" width="516.3" height="18" rx="9" fill="#0e7c72"/><text x="799" y="578" font-size="13" font-weight="700" fill="#14251f">0.7170</text>
    <rect x="270" y="588" width="418.8" height="18" rx="9" fill="#3366cc"/><text x="702" y="603" font-size="13" fill="#14251f">0.5817</text>

    <text x="870" y="451" font-size="14" font-weight="700" fill="#14251f">Top-1 accuracy</text>
    <rect x="1058" y="428" width="218.5" height="18" rx="9" fill="#ff6b3d"/><text x="1289" y="443" font-size="13" font-weight="700" fill="#14251f">0.5058</text>
    <rect x="1058" y="453" width="211.6" height="18" rx="9" fill="#0e7c72"/><text x="1282" y="468" font-size="13" fill="#14251f">0.4899</text>
    <rect x="1058" y="478" width="97.0" height="18" rx="9" fill="#3366cc"/><text x="1168" y="493" font-size="13" fill="#14251f">0.2246</text>

    <text x="870" y="561" font-size="14" font-weight="700" fill="#14251f">Spearman</text>
    <rect x="1058" y="538" width="228.5" height="18" rx="9" fill="#ff6b3d"/><text x="1299" y="553" font-size="13" fill="#14251f">0.5290</text>
    <rect x="1058" y="563" width="248.1" height="18" rx="9" fill="#0e7c72"/><text x="1319" y="578" font-size="13" font-weight="700" fill="#14251f">0.5744</text>
    <rect x="1058" y="588" width="7.5" height="18" rx="4" fill="#3366cc"/><text x="1078" y="603" font-size="13" fill="#14251f">0.0173</text>
  </g>

  <rect x="98" y="664" width="1404" height="128" rx="20" fill="#14251f"/>
  <text x="130" y="704" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.7" fill="#ff8b65">PRODUCT INTERPRETATION</text>
  <text x="130" y="742" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fffefa">Better graded ordering across the Top 5; not a universal win over a simple baseline.</text>
  <text x="130" y="773" font-family="Arial, sans-serif" font-size="14" fill="#b8c3be">Before production, pair NDCG with Precision/MAP and expert usefulness review.</text>
  <text x="1468" y="820" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#62716a">Test: 2025-06—2026-05 · BTS data through 2026-05</text>
</svg>
